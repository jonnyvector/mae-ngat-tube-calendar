name: Update tube calendar

on:
  schedule:
    - cron: "30 2 * * *"    # 09:30 Bangkok, after RID's morning report
    - cron: "30 10 * * *"   # 17:30 Bangkok, catches late reports
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch new dam readings (Royal Irrigation Department)
        run: python scripts/fetch_rid.py
      - name: Fetch catchment weather and ENSO/IOD indices
        run: python scripts/fetch_weather.py
        continue-on-error: true   # context only; a weather outage shouldn't block the forecast
      - name: Re-score the forecast against history (Mondays; the scores barely move day to day)
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f data/backtest.json ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python scripts/backtest.py
          fi
      - name: Build the page
        run: |
          python scripts/build_app.py
          mkdir -p _site && cp app/index.html _site/index.html

      - name: Save the new data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daily data update $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
